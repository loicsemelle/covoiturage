<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covoiturage Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden">
    
    <!-- Login Screen -->
    <div id="login-screen" class="flex items-center justify-center h-full hidden">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center mb-6">Connexion Covoit'</h2>
            <form id="login-form">
                <input type="password" id="password-input" placeholder="Mot de passe" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">Entrer</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-2 text-center hidden">Mot de passe incorrect</p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden max-w-[1400px] mx-auto p-4 h-full flex-col">
        <header class="shrink-0 flex justify-between items-center mb-4 bg-white p-4 rounded-lg shadow-sm">
            <h1 class="text-xl font-bold text-gray-700">Covoiturage Lycée</h1>
            <button id="logout-btn" class="text-sm text-gray-500 hover:text-gray-800">Déconnexion</button>
        </header>

        <div class="shrink-0 flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm">
            <button id="prev-week" class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition">&larr; Prec</button>
            <span id="current-week-label" class="font-semibold text-lg text-center mx-2">Semaine du ...</span>
            <button id="next-week" class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition">Suiv &rarr;</button>
        </div>

        <div class="flex-1 bg-white rounded-lg shadow-sm p-4 overflow-hidden flex flex-col">
            <div class="overflow-x-auto overflow-y-auto h-full relative border border-gray-100 rounded">
                <div class="min-w-[800px] flex flex-col">
                    <!-- Headers -->
                    <div class="flex mb-1 sticky top-0 z-40 bg-white pt-1 pb-1">
                        <div class="w-12 pr-2 sticky left-0 bg-white z-50"></div>
                        <div id="calendar-headers" class="flex-1 grid grid-cols-5 gap-2 ml-2"></div>
                    </div>
                    <!-- Grid -->
                    <div class="flex">
                        <div id="time-axis" class="w-12 border-r border-gray-200 pr-1 text-[10px] text-gray-400 text-right relative sticky left-0 bg-white z-30 pt-1"></div>
                        <div id="calendar-grid" class="flex-1 grid grid-cols-5 gap-2 ml-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-4 py-3 border-b bg-gray-50 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-gray-700">Editer Covoiturage</h3>
                <button id="modal-close" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Transport par enfant</label>
                    <div id="modal-passengers" class="flex flex-col gap-3"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Heure de départ</label>
                    <input type="time" id="modal-time" class="w-full border border-gray-300 px-3 py-2 rounded-md shadow-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="px-4 py-3 border-t bg-gray-50 flex justify-end">
                <button id="modal-save" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
